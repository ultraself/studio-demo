<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>UltraSelf Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: agency portal. Top bar, then dashboard of model cards; a model opens to a gate rail + three tracks; a track opens a one-question-per-screen wizard. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E6ECEE; --ink:#1B2347; --muted:#5F6B7A; --line:#D6DEE2;
  --accent:#2F7F74; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB; --side:#2B3035;
  --ok:#1E7A4F; --ok-soft:#DDF1E6; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#FBE1DE;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant","Rubik",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171D; --surface:#1B2129; --sunk:#262E38; --ink:#E9EEF2; --muted:#9BA8B5; --line:#2F3945;
  --accent:#6FBDB0; --accent-ink:#0D1A1C; --accent-soft:#17302E; --side:#0E1216;
  --ok:#5BC98F; --ok-soft:#173226; --warn:#E3A84A; --warn-soft:#3A2B12; --bad:#F07A6E; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171D; --surface:#1B2129; --sunk:#262E38; --ink:#E9EEF2; --muted:#9BA8B5; --line:#2F3945;
  --accent:#6FBDB0; --accent-ink:#0D1A1C; --accent-soft:#17302E; --side:#0E1216;
  --ok:#5BC98F; --ok-soft:#173226; --warn:#E3A84A; --warn-soft:#3A2B12; --bad:#F07A6E; --bad-soft:#3D1A17; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--side);color:#F2F5F6}
.top .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.brand{color:#F2F5F6}
.brand img{width:30px;height:30px;border-radius:8px;background:#FFFFFF;display:block}
.brand small{font-weight:500;color:#9FD3CB;font-size:14px}
.top .agency{color:#B8C2CC;font-size:14px;border-inline-start:1px solid #4A525B;padding-inline-start:14px}
.top .seg{border-color:#4A525B}
.top .seg button{color:#F2F5F6}
.top .seg button[aria-pressed="true"]{background:#F2F5F6;color:#2B3035}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-top:16px;font-size:14px}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.rules{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.rules .t{flex:1;min-width:220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(27,35,71,.05);display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;align-items:center;gap:8px}
.card .name{font-family:var(--display);font-weight:600;font-size:17px;flex:1}
.pct{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tracks{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tracks .bar{height:4px}
.gdots{display:flex;gap:4px}
.gdots i{width:100%;height:5px;border-radius:2px;background:var(--sunk)}
.gdots i.done{background:var(--ok)} .gdots i.wip{background:var(--warn)} .gdots i.blocked{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.agency{background:var(--warn-soft);color:var(--warn)}
.pill.us{background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:999px;padding-inline:18px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-top:20px;font-size:14px}
/* model page */
.mhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0 18px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:14px}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px;overflow-x:auto}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(104px,1fr));gap:8px;min-width:960px}
.rail li{display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--sunk);padding-top:8px}
.rail li.done{border-color:var(--ok)} .rail li.wip{border-color:var(--warn)} .rail li.blocked{border-color:var(--bad)}
.rail .g{font-weight:600;font-size:13px}
.rail .o{font-size:12px;color:var(--muted)}
.rail select{font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 4px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .who{font-size:13px;color:var(--accent);font-weight:600}
.panel ul{margin:0;padding-inline-start:18px;color:var(--muted);font-size:13px}
.side{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.alert b{color:var(--bad)}
table.facts{width:100%;border-collapse:collapse;font-size:14px}
table.facts td,table.facts th{text-align:start;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.facts th{color:var(--muted);font-weight:500;font-size:12px}
.share{font-size:12px}
.soon{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px}
/* wizard */
.wz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wz .wtop{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.wz .wbody{flex:1;overflow:auto;display:flex;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.wz .q{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px}
.wz .step{font-size:13px;color:var(--muted)}
.wz .qt{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.3}
.wz .hint{color:var(--muted);margin:0}
.wz textarea,.wz input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:17px;min-height:52px}
.wz textarea{min-height:120px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:start;cursor:pointer;font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px}
.pre.ok{background:var(--ok-soft);color:var(--ok)}
.bubble{border-radius:14px;padding:10px 14px;max-width:85%;font-size:15px}
.bubble.fan{background:var(--sunk);align-self:flex-start}
.bubble.bot{background:var(--accent-soft);align-self:flex-end}
.chat{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.chat small{color:var(--muted);font-size:12px}
.wfoot{display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.saved{font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
@media (max-width:860px){.cols{grid-template-columns:1fr}.side{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  if (item.type === 'fact') { const f = (m.facts || []).find(x => x.topic === item.topic); return f ? f.text : ''; }
  if (item.type === 'cal') return (m.cal || {})[item.k] || '';
  return (m.ans || {})[item.k] || '';
}

function renderWizard() {
  document.getElementById('wz')?.remove();
  const W = S.wz; if (!W) return;
  const item = W.items[W.i], n = W.items.length;
  const m = W.id ? S.models[W.id] : null;
  const title = W.kind === 'rules' ? t('rulesTitle') : `${L(m.name)} · ${t(W.kind)}`;
  let val = currentValue(item);
  let share = '';
  if (item.type === 'fact') { const f = (m.facts || []).find(x => x.topic === item.topic); share = f ? f.share || '' : ''; }
  const q = h('div', { class:'q' });
  q.append(h('span', { class:'step' }, `${t('step')} ${W.i + 1} ${t('of')} ${n}${item.req ? ' · ' + t('required') : ''}`));
  if (item.type === 'cal') {
    q.append(h('div', { class:'chat' }, h('small', {}, t('calFan')), h('div', { class:'bubble fan' }, L(item.cal.fan)), h('small', { style:'align-self:flex-end' }, t('calBot')), h('div', { class:'bubble bot' }, item.cal.bot)));
  }
  q.append(h('div', { class:'qt', id:'wz-title' }, item.type === 'rule' ? L(item) + ': ' + L(item.hint) : L(item)));
  if (item.hint && item.type !== 'rule') q.append(h('p', { class:'hint' }, L(item.hint)));
  const isPre = m && (m.pre || []).includes(item.k) && filled(val);
  if (isPre) {
    const ok = (m.conf || {})[item.k];
    q.append(h('div', { class:'pre' + (ok ? ' ok' : '') }, ok ? t('confirmed') : t('preFill'),
      ok ? null : h('button', { class:'btn', type:'button', style:'padding:3px 10px', onclick:() => { save({ confirm:item.k }).then(() => { renderWizard(); }); } }, t('confirmBtn'))));
  }
  let input;
  if (item.type === 'choice') {
    input = h('div', { class:'opts', role:'group', 'aria-labelledby':'wz-title' }, item.opts.map(([he, en]) => h('button', { class:'opt', type:'button', 'aria-pressed':String(val === he), onclick:() => { val = he; save({ value:he }).then(renderWizard); } }, S.lang === 'he' ? he : en)));
  } else {
    const long = item.type === 'long' || item.type === 'rule' || item.type === 'cal' || item.type === 'fact';
    input = h(long ? 'textarea' : 'input', { id:'wz-input', 'aria-labelledby':'wz-title', type:long ? null : 'text', dir:'auto' });
    input.value = val;
  }
  q.append(input);
  if (item.type === 'fact') {
    q.append(h('div', { class:'hint' }, t('share')));
    q.append(h('div', { class:'opts', role:'group' }, [['persona', t('persona')], ['real', t('real')], ['yours', t('yourCall')]].map(([k, lab]) =>
      h('button', { class:'opt', type:'button', 'aria-pressed':String(share === k), onclick:() => { save({ value:document.getElementById('wz-input').value, share:k }).then(renderWizard); } }, lab))));
  }
  if (W.kind === 'her' && item.type !== 'choice') q.append(h('button', { class:'btn ghost', type:'button', style:'align-self:flex-start', onclick:() => { save({ value:t('skip') }).then(() => step(1)); } }, t('skip')));
  q.append(h('span', { class:'saved', title:t('voiceSoon') }, t('voiceSoon')));
  const pct = Math.round((W.i + 1) / n * 100);
  const wz = h('div', { class:'wz', id:'wz', role:'dialog', 'aria-modal':'true', 'aria-label':title, dir:S.lang === 'he' ? 'rtl' : 'ltr' },
    h('div', { class:'wtop' }, h('button', { class:'btn ghost', type:'button', onclick:closeWizard, 'aria-label':'Close' }, '✕'), h('h3', { style:'flex:1' }, title), h('span', { class:'pct' }, pct + '%')),
    h('div', { style:'height:3px;background:var(--sunk)' }, h('i', { style:`display:block;height:3px;width:${pct}%;background:var(--accent)` })),
    h('div', { class:'wbody' }, q),
    h('div', { class:'wfoot' },
      h('button', { class:'btn', type:'button', disabled:W.i === 0, onclick:() => step(-1) }, t('prev')),
      h('span', { class:'saved grow', id:'wz-note' }, W.note),
      h('button', { class:'btn primary', type:'button', onclick:() => step(1) }, W.i === n - 1 ? t('done') : t('next'))));
  document.body.append(wz);
  const inp = document.getElementById('wz-input'); if (inp) { inp.focus(); inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && inp.tagName === 'INPUT') step(1); }); }
}

async function step(d) {
  const inp = document.getElementById('wz-input');
  if (inp && inp.value !== currentValue(S.wz.items[S.wz.i])) await save({ value:inp.value });
  const n = S.wz.items.length;
  if (S.wz.i + d >= n) return closeWizard();
  S.wz.i = Math.max(0, S.wz.i + d); renderWizard();
}

async function save({ value, share, confirm }) {
  const W = S.wz, item = W.items[W.i];
  const note = (s) => { W.note = s; const el = document.getElementById('wz-note'); if (el) el.textContent = s; };
  note(t('saving'));
  try {
    if (W.kind === 'rules') {
      const rules = { ...(S.agency.rules || {}) };
      rules[item.k] = { ...(rules[item.k] || {}), a:value };
      S.agency.rules = rules;
      if (S.db) await S.db.doc('agency/balagan').update({ rules });
    } else {
      const m = S.models[W.id], patch = {};
      if (confirm) { m.conf = { ...(m.conf || {}), [confirm]:true }; patch.conf = m.conf; }
      else if (item.type === 'fact') {
        const facts = [...(m.facts || [])]; const i = facts.findIndex(f => f.topic === item.topic);
        const f = { topic:item.topic, text:value != null ? value : (i >= 0 ? facts[i].text : ''), share:share != null ? share : (i >= 0 ? facts[i].share : '') };
        if (i >= 0) facts[i] = f; else facts.push(f);
        m.facts = facts; patch.facts = facts;
      } else if (item.type === 'cal') { m.cal = { ...(m.cal || {}), [item.k]:value }; patch.cal = m.cal; }
      else {
        m.ans = { ...(m.ans || {}), [item.k]:value }; patch.ans = m.ans;
        if ((m.pre || []).includes(item.k)) { m.conf = { ...(m.conf || {}), [item.k]:true }; patch.conf = m.conf; }
      }
      patch.updatedAt = new Date().toISOString();
      if (S.db) await S.db.doc('models/' + W.id).update(patch);
    }
    note(t('saved'));
  } catch (e) { note(e && e.code === 'not_granted' ? t('readonly') : t('saveFail')); }
}

async function saveGate(id, k, v) {
  const m = S.models[id]; m.gates = { ...(m.gates || {}), [k]:v };
  render();
  try { if (S.db) await S.db.doc('models/' + id).update({ gates:m.gates, updatedAt:new Date().toISOString() }); } catch (e) {}
}


const DEMO_NOTE = { he:'מצב הדגמה: דוגמניות לדוגמה בלבד. אפשר ללחוץ ולמלא, אבל השינויים לא נשמרים.', en:'Demo mode: sample models only. You can click and fill in, but changes are not saved.' };
function demoData() {
  const mk = (id, he, en, order, ans, facts, gates, extra) => ({ id, name:{he,en}, lang:'עברית', agencyLabel:S.lang === 'he' ? 'סוכנות לדוגמה' : 'Sample agency', order, ans, pre:Object.keys(ans), conf:{}, facts, gates, calItems:[], cal:{}, conflicts:[], ...(extra || {}) });
  const full = { fan_name:'דנה', age:'27', city:'חיפה', rel:'רווקה', hair:'שחור ארוך', eyes:'ירוקות', height:'1.68', job:'מדריכת יוגה', lang:'עברית', persona_type:'בת השכן', personality:'חמה, צוחקת הרבה, ישירה', never_does:'לא נפגשת, לא עושה שיחות וידאו', lvl_channel:'הלבשה תחתונה ובגדי ים', lvl_paid:'עד עירום מלא', unlockly:'dana_demo', tg_channel:'t.me/dana_demo', tg_own:'יש', style:'קצר, בלי נקודות, שאלה בסוף', meet:'לא פוסלת ולא ממהרת' };
  const all = Object.fromEntries(GATES.map(g => [g.k, 'done']));
  const models = {
    dana: mk('dana', 'דנה', 'Dana', 0, { ...full, lvl_paid:'', tg_own:'בתהליך' }, [{topic:'pets',text:"יש לה חתול ג'ינג'י בשם שוקו",share:'persona'},{topic:'music',text:'פופ ישראלי ואינדי',share:'persona'},{topic:'family',text:'אחות אחת קטנה',share:''}], { vault:'done', persona:'done', loaded:'wip' },
      { calItems:[{ fan:{he:'שאל מה היא עושה הערב',en:'Asked what she is doing tonight'}, bot:'הערב אני בבית. מה איתך?' }], conflicts:[{he:'בטופס כתוב שהיא לא נפגשת, בצד הקלדנים כתוב "לא פוסלת". צריך כלל אחד',en:'The form says she never meets fans, the chatter side says "not ruling it out". One rule is needed'}] }),
    lia: mk('lia', 'ליה', 'Lia', 1, { fan_name:'ליה', age:'24', city:'תל אביב', hair:'בלונד', persona_type:'יוקרתית' }, [], { vault:'done' }),
    tal: mk('tal', 'טל', 'Tal', 2, {}, [], {}),
    ella: mk('ella', 'אלה', 'Ella', 3, full, [{topic:'sport',text:'רצה שלוש פעמים בשבוע',share:'persona'}], all)
  };
  const rules = {}; RULES.slice(0, 9).forEach(([k]) => { rules[k] = { a:'תשובה לדוגמה של הסוכנות' }; });
  return { models, agency:{ rules } };
}
function startDemo() { const d = demoData(); S.db = null; S.demo = true; S.models = d.models; S.agency = d.agency; S.ready = true; render(); }

/* ---------- routing + render ---------- */
function go(r) { location.hash = r ? '#' + r : ''; if (!r) route(); }
function route() { S.route = (location.hash || '').slice(1); render(); window.scrollTo(0, 0); }
function render() {
  const app = document.getElementById('app');
  app.dir = S.lang === 'he' ? 'rtl' : 'ltr'; app.lang = S.lang;
  document.getElementById('lang-he').setAttribute('aria-pressed', String(S.lang === 'he'));
  document.getElementById('lang-en').setAttribute('aria-pressed', String(S.lang === 'en'));
  document.getElementById('agency-name').textContent = S.demo ? (S.lang === 'he' ? 'סוכנות לדוגמה' : 'Sample agency') : (S.lang === 'he' ? 'BALAGAN · ישראל' : 'BALAGAN · Israel');
  const dn = document.getElementById('demo-note'); dn.hidden = !S.demo; dn.textContent = S.demo ? DEMO_NOTE[S.lang] : '';
  const view = document.getElementById('view');
  if (!S.ready) return;
  view.replaceChildren(S.route.startsWith('m-') ? viewModel(S.route.slice(2)) : viewHome());
}
function setLang(l) { S.lang = l; try { localStorage.setItem('us_lang', l); } catch (e) {} render(); if (S.wz) renderWizard(); }
document.getElementById('lang-he').onclick = () => setLang('he');
document.getElementById('lang-en').onclick = () => setLang('en');
document.getElementById('home-btn').onclick = () => go('');
window.addEventListener('hashchange', route);
route();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  S.db = db;
  if (!db) { startDemo(); return; }
  let gotM = false, gotA = false;
  const done = () => { if (gotM && gotA) { S.ready = true; render(); } };
  db.collection('models').onSnapshot((snap) => {
    if (S.demo) return; if (snap.empty && !gotM) { startDemo(); return; }
    const next = {}; snap.docs.forEach(d => { next[d.id] = { id:d.id, ...d.data() }; });
    S.models = next; gotM = true; if (!S.ready) done(); else if (!S.wz) render();
  }, () => { if (!S.ready) startDemo(); });
  db.doc('agency/balagan').onSnapshot((snap) => {
    if (S.demo) return;
    S.agency = snap.exists ? snap.data() : { rules:{} }; if (!S.agency.rules) S.agency.rules = {};
    gotA = true; if (!S.ready) done(); else if (!S.wz) render();
  }, () => { if (!S.demo) { S.agency = { rules:{} }; gotA = true; done(); } });
})();
})();
</script>
